  <line x1="14" y1="32" x2="50" y2="32" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <line x1="19" y1="19" x2="45" y2="45" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="45" y1="19" x2="19" y2="45" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
