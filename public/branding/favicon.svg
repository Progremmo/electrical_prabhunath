  <line x1="32" y1="14" x2="38" y2="20" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="50" x2="26" y2="44" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
