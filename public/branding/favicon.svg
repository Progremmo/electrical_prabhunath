  <line x1="50" y1="32" x2="44" y2="26" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="32" x2="44" y2="38" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
