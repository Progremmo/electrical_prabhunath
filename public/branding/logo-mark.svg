  <path d="M22 24H26V32" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="22" cy="24" r="1.5" fill="#60A5FA" opacity="0.8"/>
  <path d="M42 24H38V32" stroke="#60A5FA" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <circle cx="42" cy="24" r="1.5" fill="#60A5FA" opacity="0.8"/>

  <!-- Prominent Electric Lightning Bolt & "P" Monogram Energy Form -->
  <path d="M35 14L22 33H33L28 50L44 29H33L38 14H35Z" fill="url(#boltGrad)" filter="url(#glow)"/>
