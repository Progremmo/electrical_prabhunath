<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <!-- Symbol / Icon -->
  <g transform="translate(10, 10)">
    <!-- Base snowflake/fan rounded badge -->
    <rect width="60" height="60" rx="16" fill="#0F766E"/>
    <!-- Snowflake & Cooling Breeze lines -->
    <path d="M30 12 L30 48 M12 30 L48 30" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 17 L43 43 M17 43 L43 17" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Central cooling node -->
    <circle cx="30" cy="30" r="5" fill="#F59E0B" />
    <!-- Dynamic cool wind curve -->
    <path d="M22 25 C26 22, 34 22, 38 25 M20 35 C25 38, 35 38, 40 35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9"/>
  </g>
  <!-- Text Brand -->
  <text x="82" y="38" font-family="'Inter', -apple-system, sans-serif" font-size="22" font-weight="800" fill="#0F766E" letter-spacing="-0.5">
    AARAV <tspan fill="#2563EB">AIRCON</tspan>
  </text>
  <text x="83" y="56" font-family="'Inter', -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.2">
    SERVICES • PAN INDIA
  </text>
</svg>
