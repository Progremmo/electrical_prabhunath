  <!-- Protective Outer Shield representing Contractor Safety & Reliability -->
  <path d="M32 4L12 12V28C12 43 21 54 32 60C43 54 52 43 52 28V12L32 4Z" fill="url(#shieldGrad)" stroke="#38BDF8" stroke-width="1.5" stroke-linejoin="round"/>

